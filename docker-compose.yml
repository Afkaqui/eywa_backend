services:
  eywa-api:
    build: .
    container_name: eywa_api
    restart: always
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - UPLOAD_DIR=/app/uploads
      # IA del Validador (opcional). Si no están definidas en .env llegan vacías,
      # isAiConfigured() da false y el validador usa el heurístico determinista.
      # Compatible con cualquier API estilo OpenAI (/chat/completions).
      - VALIDATOR_AI_URL=${VALIDATOR_AI_URL:-}
      - VALIDATOR_AI_KEY=${VALIDATOR_AI_KEY:-}
      - VALIDATOR_AI_MODEL=${VALIDATOR_AI_MODEL:-}
      # Fase 3 · lectura de documentos adjuntos (dormida). Poner "true" en .env para
      # que la IA reciba el texto extraído de los PDFs/Word/Excel subidos al plan.
      - VALIDATOR_READ_DOCS=${VALIDATOR_READ_DOCS:-}
      # Correo transaccional (Resend). Sin RESEND_API_KEY el envío queda deshabilitado.
      # OJO: si una variable no se declara AQUÍ, no llega al contenedor aunque esté
      # en el .env — es el fallo silencioso que ya nos pasó con VALIDATOR_AI_*.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
    volumes:
      # Archivos del Dataroom en el DISCO DEL HOST: el auto-deploy recrea el
      # contenedor, así que dentro de él los uploads se perderían.
      - /home/kaqui/eywa-uploads:/app/uploads
    networks:
      - postgresql_default
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  postgresql_default:
    external: true
