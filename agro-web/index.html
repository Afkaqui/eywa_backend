<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f9fafb; }
  .inp { width: 100%; border: 1px solid #e5e7eb; border-radius: .5rem; padding: .55rem .75rem; font-size: 16px; background: #fff; } /* 16px: evita el zoom automático de iOS */
  .inp:focus { outline: 2px solid #10b981; outline-offset: 0; }
  @media (min-width: 768px) { .inp { font-size: .875rem; } }
  .btn { background: #059669; color: #fff; border-radius: .5rem; padding: .55rem 1rem; font-size: .875rem; font-weight: 600; min-height: 40px; }
  .btn:hover { background: #047857; } .btn:disabled { opacity: .5; }
  .btn2 { border: 1px solid #e5e7eb; border-radius: .5rem; padding: .45rem .75rem; font-size: .8rem; font-weight: 500; color: #374151; background: #fff; min-height: 36px; }
  .btn2:hover { background: #f9fafb; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: .75rem; padding: 1.25rem; }
  .rt { width: 100%; border-collapse: collapse; }
  .rt th { text-align: left; font-size: .7rem; text-transform: uppercase; color: #6b7280; padding: .5rem; border-bottom: 1px solid #e5e7eb; }
  .rt td { padding: .55rem .5rem; border-bottom: 1px solid #f3f4f6; font-size: .85rem; vertical-align: top; }
  /* Móvil: cada fila de tabla es una tarjeta con su etiqueta */
  @media (max-width: 767px) {
    .rt thead { display: none; }
    .rt tr { display: block; border: 1px solid #e5e7eb; border-radius: .75rem; padding: .5rem .75rem; margin-bottom: .6rem; background: #fff; }
    .rt td { display: flex; justify-content: space-between; gap: 1rem; border: 0; padding: .3rem 0; text-align: right; }
    .rt td::before { content: attr(data-l); font-size: .7rem; text-transform: uppercase; color: #6b7280; text-align: left; flex-shrink: 0; padding-top: .1rem; }
    .rt td.acc { justify-content: flex-end; flex-wrap: wrap; } .rt td.acc::before { content: none; }
    .rt-wrap { border: 0 !important; padding: 0 !important; background: transparent !important; }
  }
  dialog::backdrop { background: rgba(17,24,39,.45); }
  dialog { border: 0; border-radius: 1rem; padding: 0; width: min(92vw, 440px); }

<body class="text-gray-800">
<header id="cab" class="bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="/" data-ir class="flex items-center gap-2 min-w-0">
      <img src="/logo.png" alt="EYWA" class="w-9 h-9 object-contain shrink-0">
      <span class="leading-tight hidden sm:block"><span class="block font-extrabold tracking-wide">EYWA <span class="text-emerald-600">AGRO</span></span>
      <span class="block text-[10px] font-semibold tracking-widest text-emerald-600">ORQUESTACIÓN DE ECOSISTEMAS</span></span>
      <span class="font-extrabold sm:hidden whitespace-nowrap text-[15px]">EYWA <span class="text-emerald-600">AGRO</span></span>
    </a>
    <div id="orgsel" class="ml-auto min-w-0"></div>
    <button id="hamb" class="lg:hidden btn2 shrink-0" aria-label="Menú" aria-expanded="false">☰</button>
  </div>
  <nav id="nav" class="max-w-6xl mx-auto px-4 pb-2 hidden lg:flex flex-wrap gap-1 text-sm"></nav>
</header>
<main id="app" class="max-w-6xl mx-auto px-4 py-6"></main>
<dialog id="dlg"></dialog>

<script>
// ══ EYWA Agro — trazabilidad por organización ═══════════════════════════════════
// Misma cuenta y API que EYWA. Todo dato pertenece a una ORGANIZACIÓN (cooperativa,
// asociación, agroindustria); la activa viaja en la cabecera X-Agro-Org.
// Roles: admin (todo, incl. ventas/pagos y equipo) · tecnico (registra) · lector.
// Los textos del servidor se insertan siempre escapados.
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 0) => (n == null ? '—' : Number(n).toLocaleString('es-PE', { maximumFractionDigits: d }));
const hoy = () => new Date().toISOString().slice(0, 10);
const EYWA = 'https://eywa.encsust4in4ble.earth';
const leer = (k) => { try { return sessionStorage.getItem(k); } catch { return null; } };
const guardar = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} };
let token = leer('agro_token');
let orgs = [];          // organizaciones del usuario
let org = null;         // activa
const puede = { escribir: () => org && org.rol !== 'lector', admin: () => org && org.rol === 'admin' };

async function api(ruta, opt = {}) {
  const r = await fetch('/api' + ruta, {
    method: opt.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(org ? { 'X-Agro-Org': org.id } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { salir(); throw new Error('Tu sesión expiró'); }
  if (!r.ok && !opt.aceptar?.includes(r.status)) throw new Error(d.error || ('Error ' + r.status));
  return opt.conEstado ? { status: r.status, d } : d;
}
function salir() { token = null; org = null; orgs = []; guardar('agro_token', null); guardar('agro_org', null); ir('/'); }
function ir(ruta) { history.pushState({}, '', ruta); render(); }
window.ir = ir;
window.addEventListener('popstate', render);
document.addEventListener('click', (e) => { const a = e.target.closest('a[data-ir]'); if (a) { e.preventDefault(); cerrarMenu(); ir(a.getAttribute('href')); } });

// ── Cabecera: organización activa + menú (hamburguesa en móvil) ──
function cerrarMenu() { const n = $('#nav'); if (window.innerWidth < 1024) n.classList.add('hidden'); $('#hamb').setAttribute('aria-expanded', 'false'); }
$('#hamb').onclick = () => { const n = $('#nav'); n.classList.toggle('hidden'); n.classList.add('flex'); $('#hamb').setAttribute('aria-expanded', String(!n.classList.contains('hidden'))); };
function cabecera() {
  const items = token && org ? [['/', 'Panel'], ['/productores', 'Productores'], ['/lotes', 'Parcelas'], ['/acopio', 'Acopio'],
    ...(puede.escribir() ? [['/importar', 'Importar Excel']] : []), ['/equipo', 'Equipo'], ['/fondos', 'Fondos'], ['/actores', 'Actores'], ['/glosario', 'Glosario']] : [];
  $('#nav').innerHTML = items.map(([h, t]) => `<a data-ir href="${h}" class="px-3 py-2 rounded-full whitespace-nowrap ${location.pathname === h ? 'bg-gray-900 text-white' : 'hover:bg-gray-100'}">${t}</a>`).join('')
    + (token ? '<button id="salir" class="px-3 py-2 text-gray-500 hover:text-gray-800 text-left">Salir</button>' : '');
  const s = $('#salir'); if (s) s.onclick = salir;
  $('#hamb').style.display = token ? '' : 'none';
  $('#orgsel').innerHTML = token && orgs.length ? `
    <select id="org" class="inp !py-1.5 !text-sm max-w-[11rem] sm:max-w-xs truncate" aria-label="Organización activa">
      ${orgs.map((o) => `<option value="${o.id}" ${org && o.id === org.id ? 'selected' : ''}>${esc(o.nombre)} · ${esc(etiquetaRol(o.rol))}</option>`).join('')}
      <option value="__nueva">+ Nueva organización</option>
    </select>` : '';
  const sel = $('#org');
  if (sel) sel.onchange = () => {
    if (sel.value === '__nueva') return ir('/organizaciones');
    org = orgs.find((o) => o.id === sel.value); guardar('agro_org', org.id); render();
  };
}
const etiquetaRol = (r) => ({ admin: 'administrador', tecnico: 'técnico de campo', lector: 'lector' }[r] || r);

function aviso(msg, tipo = 'error') {
  return `<div class="mb-4 text-sm rounded-lg p-3 ${tipo === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'}">${esc(msg)}</div>`;
}
function datosForm(f) {
  const o = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.value === '') o[el.name] = null;
    else o[el.name] = el.dataset.num !== undefined ? Number(el.value) : el.value;
  }
  return o;
}
// Tabla que en móvil se convierte en tarjetas (cada celda lleva su etiqueta).
function tabla(cols, filas, vacio) {
  if (!filas.length) return `<p class="text-sm text-gray-500">${vacio}</p>`;
  return `<table class="rt"><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>
    ${filas.map((f) => `<tr>${f.map((v, i) => (cols[i] === '' ? `<td class="acc">${v}</td>` : `<td data-l="${cols[i]}"><div>${v}</div></td>`)).join('')}</tr>`).join('')}</tbody></table>`;
}
// Ventana con formulario (reemplaza a prompt(), que en el celular se ve mal).
function modal(titulo, campos, alEnviar) {
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog" class="p-5 space-y-3"><div class="font-semibold text-lg">${titulo}</div><div id="dmsg"></div>
    ${campos.map((c) => `<label class="block"><span class="text-sm text-gray-600">${c.t}</span>
      <input class="inp mt-1" name="${c.n}" type="${c.tipo || 'text'}" ${c.num ? 'data-num step="any"' : ''} value="${esc(c.v ?? '')}" ${c.req ? 'required' : ''} ${c.min != null ? `min="${c.min}"` : ''} ${c.max != null ? `max="${c.max}"` : ''}></label>`).join('')}
    <div class="flex gap-2 justify-end pt-2"><button value="cancel" formnovalidate class="btn2">Cancelar</button><button class="btn" value="ok">Guardar</button></div></form>`;
  const f = d.querySelector('form');
  f.onsubmit = async (e) => {
    if (e.submitter?.value !== 'ok') return;
    e.preventDefault();
    try { await alEnviar(datosForm(f)); d.close(); } catch (err) { $('#dmsg').innerHTML = aviso(err.message); }
  };
  d.showModal();
}

async function cargarOrgs() {
  orgs = (await api('/agro/organizaciones')).organizaciones;
  const guardada = leer('agro_org');
  org = orgs.find((o) => o.id === guardada) || orgs[0] || null;
  if (org) guardar('agro_org', org.id);
}

async function render() {
  const p = location.pathname, app = $('#app');
  const pub = p.match(/^\/p\/((LT|SC)-[0-9A-F]{8})$/i);
  if (pub) { cabecera(); return pasaporte(app, pub[1].toUpperCase()); }
  if (!token) { cabecera(); return login(app); }
  $('#cab').style.display = ''; app.className = 'max-w-6xl mx-auto px-4 py-6';
  // Indicador de carga: con la conexión de campo, una pantalla en blanco parece un error.
  app.innerHTML = '<div class="flex items-center gap-2 text-sm text-gray-400 py-10 justify-center"><span class="inline-block w-4 h-4 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></span>Cargando…</div>';
  cerrarMenu();
  try {
    if (!orgs.length) await cargarOrgs();
    cabecera();
    if (!org || p === '/organizaciones') return nuevaOrganizacion(app);
    if (p === '/productores') return await productores(app);
    if (p === '/lotes') return await lotes(app);
    if (p === '/acopio') return await acopio(app);
    if (p === '/importar') return importar(app);
    if (p === '/equipo') return await equipo(app);
    if (p === '/fondos') return await fondos(app);
    if (p === '/actores') return await actores(app);
    if (p === '/glosario') return await glosario(app);
    return await panel(app);
  } catch (e) { app.innerHTML = aviso(e.message); }
}

// ── Login: el mismo de EYWA (misma cuenta, mismo diseño) ──
function login(app) {
  $('#cab').style.display = 'none';
  app.className = '';
  app.innerHTML = `
  <div class="min-h-screen flex">
    <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-8 bg-white">
      <div class="w-full max-w-md">
        <a href="${EYWA}" class="flex items-center gap-2 text-sm text-gray-500 hover:text-gray-900 mb-8">← Ir a EYWA</a>
        <div class="flex items-center gap-3 mb-10">
          <img src="/logo.png" alt="EYWA" class="w-12 h-12 object-contain">
          <div><div class="text-gray-900 font-bold text-2xl tracking-tight">EYWA <span class="text-emerald-600">AGRO</span></div>
          <div class="text-emerald-600 text-xs tracking-wider">ORQUESTACIÓN DE ECOSISTEMAS</div></div>
        </div>
        <h1 class="text-3xl sm:text-4xl font-light text-gray-900 mb-3">Bienvenido</h1>
        <p class="text-gray-600 mb-8">Entra con tu cuenta de EYWA: es la misma.</p>
        <div id="msg"></div>
        <form id="f" class="space-y-5">
          <label class="block"><span class="block text-sm font-medium text-gray-700 mb-2">Correo electrónico</span>
            <input class="inp" name="email" type="email" placeholder="tu@empresa.com" required autocomplete="username"></label>
          <label class="block"><span class="block text-sm font-medium text-gray-700 mb-2">Contraseña</span>
            <input class="inp" name="password" type="password" placeholder="••••••••" required autocomplete="current-password"></label>
          <div class="text-right"><a href="${EYWA}/recuperar" class="text-sm text-emerald-600 hover:text-emerald-700">¿Olvidaste tu contraseña?</a></div>
          <button class="w-full py-3.5 bg-gray-900 text-white rounded-lg hover:bg-gray-800 font-semibold disabled:opacity-50" id="entrar">Iniciar Sesión</button>
        </form>
        <p class="mt-8 text-center text-sm text-gray-500">¿No tienes cuenta? <a href="${EYWA}" class="text-emerald-600 font-medium">Regístrate en EYWA</a></p>
      </div>
    </div>
    <div class="hidden lg:block lg:w-1/2 relative">
      <div class="absolute inset-0 bg-cover bg-center" style="background-image:url('https://images.unsplash.com/photo-1622353133218-825cfebb6844?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080')">
        <div class="absolute inset-0 bg-gradient-to-br from-emerald-900/90 to-gray-900/80"></div></div>
      <div class="relative z-10 h-full flex flex-col justify-between p-12">
        <div><span class="inline-flex px-4 py-2 bg-white/10 border border-white/20 rounded-full text-emerald-300 text-sm font-medium">Vertical agro</span></div>
        <div>
          <h2 class="text-5xl font-light text-white mb-6 leading-tight">Del lote al saco,<br><span class="font-semibold">trazable y justo</span></h2>
          <p class="text-xl text-gray-300 leading-relaxed max-w-lg">Lotes georreferenciados, centro de acopio digital y un pasaporte con QR para cada saco: de dónde viene, cuándo se vendió y cuánto recibió el productor.</p>
        </div>
      </div>
    </div>
  </div>`;
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); $('#entrar').disabled = true;
    try {
      const d = await api('/auth/login', { method: 'POST', body: datosForm(e.target) });
      token = d.token; guardar('agro_token', token); orgs = [];
      ir('/');
    } catch (err) { $('#msg').innerHTML = aviso(err.message); $('#entrar').disabled = false; }
  };
}

// ── Organización: alta (y primera vez) ──
function nuevaOrganizacion(app) {
  const primera = !orgs.length;
  app.innerHTML = `
  <div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-light mb-2">${primera ? 'Crea tu organización' : 'Nueva organización'}</h1>
    <p class="text-sm text-gray-500 mb-5">${primera ? 'Todo en EYWA Agro se registra dentro de una organización: tu cooperativa, asociación o empresa. Tú quedarás como administrador y podrás sumar a tus técnicos de campo.' : 'Quedarás como administrador.'}</p>
    <div id="msg"></div>
    <form id="f" class="card space-y-3">
      <label class="block"><span class="text-sm text-gray-600">Nombre</span><input class="inp mt-1" name="nombre" required placeholder="Cooperativa Agraria …"></label>
      <div class="grid sm:grid-cols-2 gap-3">
        <label class="block"><span class="text-sm text-gray-600">Tipo</span><select class="inp mt-1" name="tipo">
          <option value="cooperativa">Cooperativa</option><option value="asociacion">Asociación de productores</option>
          <option value="agroindustria">Agroindustria</option><option value="comprador">Comprador / exportador</option><option value="otro">Otro</option></select></label>
        <label class="block"><span class="text-sm text-gray-600">RUC (opcional)</span><input class="inp mt-1" name="ruc" inputmode="numeric" maxlength="11"></label>
        <label class="block"><span class="text-sm text-gray-600">Cadena principal</span><input class="inp mt-1" name="cadena" value="cacao"></label>
        <label class="block"><span class="text-sm text-gray-600">Región</span><input class="inp mt-1" name="region" placeholder="Cusco"></label>
      </div>
      <div class="flex gap-2 pt-1">${primera ? '' : '<a data-ir href="/" class="btn2 inline-flex items-center">Cancelar</a>'}<button class="btn">Crear organización</button></div>
    </form>
  </div>`;
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const d = await api('/agro/organizaciones', { method: 'POST', body: datosForm(e.target) });
      guardar('agro_org', d.organizacion.id); orgs = []; ir('/');
    } catch (err) { $('#msg').innerHTML = aviso(err.message); }
  };
}

// ── Panel ──
async function panel(app) {
  const r = await api('/agro/resumen');
  const kpi = (t, v, s = '') => `<div class="card !p-4 sm:!p-5"><div class="text-2xl font-light">${v}</div><div class="text-xs uppercase tracking-wider text-gray-500">${t}</div>${s ? `<div class="text-xs text-gray-400 mt-1">${s}</div>` : ''}</div>`;
  app.innerHTML = `
  <div class="flex flex-wrap items-baseline gap-x-3 mb-5"><h1 class="text-2xl font-light">${esc(org.nombre)}</h1>
    <span class="text-sm text-gray-500">Tu rol: ${esc(etiquetaRol(r.rol))}</span></div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
    ${kpi('Productores', num(r.productores))}
    ${kpi('Parcelas', num(r.lotes), num(r.hectareas, 2) + ' ha')}
    ${kpi('Georreferenciadas', `${num(r.lotes_georreferenciados)} / ${num(r.lotes)}`, `${num(r.lotes_con_declaracion)} con declaración de no deforestación`)}
    ${kpi('Acopiado', num(r.kilos_acopiados) + ' kg', 'Pagado a productores: USD ' + num(r.pagado_productores, 2))}
  </div>
  <div class="card text-sm text-gray-600">
    <p class="font-medium text-gray-800 mb-2">Cómo funciona</p>
    <ol class="list-decimal ml-5 space-y-1">
      <li>Registra a cada <b>productor</b> y sus <b>parcelas</b> con coordenadas (requisito del reglamento europeo contra la deforestación). Si son muchos, usa <b>Importar Excel</b>.</li>
      <li>Anota las <b>cosechas</b> de cada parcela.</li>
      <li>En el <b>acopio</b>, cada saco entregado recibe un código y un QR: es su pasaporte.</li>
      <li>Al vender, el administrador registra la fecha y el precio de referencia: queda calculado lo que le corresponde al productor según el % pactado, y cuándo se le pagó.</li>
    </ol>
    <p class="text-xs text-gray-400 mt-3">La "no deforestación" es una declaración del productor con fecha; aún no hay verificación satelital.</p>
  </div>
  <div class="card mt-4 text-sm">
    <p class="font-medium text-gray-800 mb-2">Con tu misma cuenta, en EYWA</p>
    <div class="flex flex-wrap gap-2">
      <a class="btn2" href="${EYWA}/?vista=diagnostico" target="_blank" rel="noopener">Diagnóstico GENES de tu organización</a>
      <a class="btn2" href="${EYWA}/?vista=dataroom" target="_blank" rel="noopener">Dataroom</a>
      <a class="btn2" href="${EYWA}/?vista=validador" target="_blank" rel="noopener">Validador de proyectos</a>
      <a class="btn2" href="${EYWA}/?vista=academia" target="_blank" rel="noopener">Academia</a>
    </div>
  </div>`;
}

// ── Productores ──
async function productores(app, msg = '') {
  const { productores: ps } = await api('/agro/productores');
  app.innerHTML = `
  <h1 class="text-2xl font-light mb-5">Productores</h1>${msg}
  <div class="grid lg:grid-cols-3 gap-4">

// ── Importar Excel ──
// Columnas de la plantilla. Se aceptan sinónimos y mayúsculas/tildes indistintas.
const COLUMNAS = ['productor', 'dni', 'comunidad', 'telefono', 'lote', 'cultivo', 'variedad', 'hectareas',
  'departamento', 'provincia', 'distrito', 'latitud', 'longitud', 'sin_deforestacion'];
const SINONIMOS = { nombre: 'productor', nombre_productor: 'productor', productor_nombre: 'productor', parcela: 'lote', nombre_lote: 'lote',
  nombre_parcela: 'lote', ha: 'hectareas', area: 'hectareas', lat: 'latitud', lon: 'longitud', lng: 'longitud', long: 'longitud',
  celular: 'telefono', no_deforestacion: 'sin_deforestacion', declara_no_deforestacion: 'sin_deforestacion', deforestacion: 'sin_deforestacion' };
const normCol = (k) => { const c = String(k).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); return SINONIMOS[c] || c; };

function descargarPlantilla() {
  const ejemplo = { productor: 'María Quispe Huamán', dni: '40123456', comunidad: 'Kepashiato', telefono: '987654321', lote: 'Parcela El Mirador',
    cultivo: org.cadena || 'cacao', variedad: 'Chuncho', hectareas: 1.5, departamento: 'Cusco', provincia: 'La Convención', distrito: 'Megantoni',
    latitud: -12.6134, longitud: -72.9421, sin_deforestacion: 'sí' };
  const ws = XLSX.utils.json_to_sheet([ejemplo], { header: COLUMNAS });
  ws['!cols'] = COLUMNAS.map(() => ({ wch: 16 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'productores_parcelas');
  XLSX.writeFile(wb, 'plantilla_eywa_agro.xlsx');
}

function importar(app) {
  app.innerHTML = `
  <h1 class="text-2xl font-light mb-1">Importar productores y parcelas</h1>
  <p class="text-sm text-gray-500 mb-5">Una fila por parcela. Si un productor tiene varias parcelas, repite su nombre y DNI. Se valida todo antes de guardar: si hay errores, no se guarda nada y verás qué corregir.</p>
  <div class="grid lg:grid-cols-3 gap-4">
    <div class="card space-y-3 h-fit">
      <div class="font-medium">1 · Plantilla</div>
      <p class="text-sm text-gray-600">Columnas: ${COLUMNAS.map((c) => `<code class="text-xs bg-gray-100 rounded px-1">${c}</code>`).join(' ')}</p>
      <p class="text-xs text-gray-500">Obligatorias: productor y lote. El DNI evita duplicados. "sin_deforestacion": sí / no.</p>
      <button id="plantilla" class="btn2">Descargar plantilla (.xlsx)</button>
      <div class="font-medium pt-2">2 · Tu archivo</div>
      <input id="arch" type="file" accept=".xlsx,.xls,.csv" class="block w-full text-sm file:mr-3 file:btn2 file:border file:border-gray-200 file:rounded-lg file:bg-white file:px-3 file:py-2">
    </div>
    <div class="card lg:col-span-2" id="res"><p class="text-sm text-gray-500">Elige un archivo para revisarlo.</p></div>
  </div>`;
  $('#plantilla').onclick = () => (window.XLSX ? descargarPlantilla() : alert('Cargando… intenta de nuevo en unos segundos'));
  let filas = [];
  $('#arch').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (!window.XLSX) return alert('Cargando el lector de Excel… intenta de nuevo');
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const crudas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
      filas = crudas.map((r) => Object.fromEntries(Object.entries(r).map(([k, v]) => [normCol(k), v])))
        .filter((r) => Object.values(r).some((v) => String(v).trim() !== ''));
      const desconocidas = [...new Set(crudas.flatMap((r) => Object.keys(r)).map(normCol))].filter((c) => !COLUMNAS.includes(c) && !c.startsWith('empty'));
      await validar(true, desconocidas);
    } catch (err) { $('#res').innerHTML = aviso('No se pudo leer el archivo: ' + err.message); }
  };
  async function validar(simular, desconocidas = []) {
    $('#res').innerHTML = '<p class="text-sm text-gray-400">Revisando…</p>';
    const { status, d } = await api('/agro/importar', { method: 'POST', body: { filas, simular }, aceptar: [422], conEstado: true });
    const r = d.resumen || {};
    const cifras = `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
      ${[['Filas', r.filas], ['Productores nuevos', r.productores_nuevos], ['Ya existentes', r.productores_existentes], ['Parcelas nuevas', r.lotes_nuevos]]
        .map(([t, v]) => `<div class="bg-gray-50 rounded-lg p-3"><div class="text-xl font-light">${num(v)}</div><div class="text-[11px] uppercase text-gray-500">${t}</div></div>`).join('')}</div>`;
    const ignoradas = desconocidas.length ? `<p class="text-xs text-amber-700 mb-3">Columnas que no se usan: ${desconocidas.map(esc).join(', ')}</p>` : '';
    if (status === 422) {
      $('#res').innerHTML = aviso(`Hay ${d.errores.length} fila(s) con errores. No se guardó nada.`) + cifras + ignoradas
        + `<div class="rt-wrap">${tabla(['Fila', 'Error'], d.errores.slice(0, 200).map((x) => [x.fila, esc(x.mensaje)]), '')}</div>`;
      return;
    }
    if (d.guardado) { orgs = []; $('#res').innerHTML = aviso(`Listo: se guardaron ${r.lotes_nuevos} parcelas y ${r.productores_nuevos} productores nuevos.`, 'ok') + cifras + '<a data-ir href="/lotes" class="btn inline-block">Ver parcelas</a>'; return; }
    $('#res').innerHTML = aviso('El archivo está correcto. Revisa las cifras y confirma.', 'ok') + cifras + ignoradas + '<button id="conf" class="btn">Importar ahora</button>';
    $('#conf').onclick = () => validar(false, desconocidas).catch((err) => { $('#res').innerHTML = aviso(err.message); });
  }
}

async function fondos(app) {
  const r = await fetch('/api/funds', { headers: { Authorization: 'Bearer ' + token } });

  const d = await r.json();
  const todos = d.funds || [];
  const agro = todos.filter((f) => (f.sector_tags || []).some((t) => ['agro', 'ambiente', 'clima', 'circular'].includes(t)));
  const vig = (f) => !f.deadline || new Date(f.deadline) > new Date();
  app.innerHTML = `
  <h1 class="text-2xl font-light mb-1">Fondos para agro</h1>
  <p class="text-sm text-gray-500 mb-5">${agro.length} de ${todos.length} fondos del catálogo de EYWA (agro, ambiente, clima y economía circular). Se verifican automáticamente cada noche.</p>
  <div class="card rt-wrap">${tabla(['Fondo', 'Instrumento', 'Monto', 'Cierre'], agro.sort((a, b) => vig(b) - vig(a)).map((f) => [
    `${f.url ? `<a class="text-emerald-700 underline" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>` : esc(f.name)}
      <div class="text-xs text-gray-400">${esc(f.scope)}${f.verify_status === 'enlace_roto' ? ' · enlace por verificar' : ''}</div>`,

    `<span class="text-xs ${vig(f) ? '' : 'text-gray-400'}">${f.deadline ? esc(f.deadline.slice(0, 10)) + (vig(f) ? '' : ' (cerrado)') : esc(f.deadline_text || '—')}</span>`,

}

    <div class="text-xs text-gray-500">${esc(a.pais)} · ${esc(a.categoria.replace(/_/g, ' '))}</div>
    ${a.descripcion ? `<p class="text-sm text-gray-600 mt-1">${esc(a.descripcion.slice(0, 220))}${a.descripcion.length > 220 ? '…' : ''}</p>` : ''}</div>`).join('')}</div>`;
  $('#fq').onsubmit = (e) => { e.preventDefault(); ir('/actores?q=' + encodeURIComponent(e.target.q.value)); };
}

async function glosario(app) {
  const d = await api('/public/v1/glosario');
  const cats = [...new Set(d.terminos.map((t) => t.categoria))].sort((a, b) => (a === 'Agro' ? -1 : b === 'Agro' ? 1 : 0));
  app.innerHTML = `
  <h1 class="text-2xl font-light mb-1">Glosario</h1>
  <p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-5">${esc(d.estado)}</p>
  ${cats.map((c) => `<div class="mb-6"><div class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">${esc(c)}</div>
    ${d.terminos.filter((t) => t.categoria === c).map((t) => `<div class="mb-3"><div class="font-medium text-sm">${esc(t.termino)}${t.sigla ? ` <span class="text-emerald-700">· ${esc(t.sigla)}</span>` : ''}</div>
    <div class="text-sm text-gray-600">${esc(t.definicion)}</div></div>`).join('')}</div>`).join('')}`;
}

// ── Pasaporte público ──
async function pasaporte(app, cod) {
  $('#cab').style.display = ''; app.className = 'max-w-6xl mx-auto px-4 py-6';
  app.innerHTML = '<p class="text-sm text-gray-400">Cargando pasaporte…</p>';
  let d;
  try { d = await api(cod.startsWith('SC') ? '/agro/publico/saco/' + cod : '/agro/publico/lote/' + cod); }
  catch (e) { app.innerHTML = aviso('Pasaporte no encontrado: ' + cod); return; }
  const l = d.lote, s = d.saco;
  const fila = (k, v) => `<div class="flex justify-between gap-4 py-2 border-b border-gray-100 text-sm"><span class="text-gray-500 shrink-0">${k}</span><span class="text-right break-words">${v}</span></div>`;
  app.innerHTML = `
  <div class="max-w-2xl mx-auto card">
    <div class="flex flex-col-reverse sm:flex-row items-start justify-between gap-4">
      <div class="min-w-0"><div class="text-xs uppercase tracking-widest text-emerald-700 font-semibold">Pasaporte digital · ${s ? 'saco' : 'parcela'}</div>
        <h1 class="text-2xl font-light mt-1 break-words">${esc(s ? s.codigo : l.nombre)}</h1>
        <div class="text-sm text-gray-500">${esc(l.cultivo)} ${esc(l.variedad || '')} · ${esc(l.ubicacion || 'ubicación no registrada')}</div></div>
      <div id="qr" class="shrink-0 self-center sm:self-start"></div>
    </div>
    <div class="mt-5">
      ${s ? fila('Entregado en acopio', `${esc(s.fecha_entrega)} · ${num(s.kilos, 1)} kg${s.calidad ? ' · ' + esc(s.calidad) : ''}`)
         + fila('Vendido', s.fecha_venta ? `${esc(s.fecha_venta)} · USD ${num(s.precio_referencia, 2)}/t` : 'aún no')
         + fila('Pactado con el productor', s.porcentaje_pactado != null ? num(s.porcentaje_pactado, 1) + ' % del precio' : '—')
         + fila('Recibió el productor', s.monto_productor != null ? `USD ${num(s.monto_productor, 2)} ${s.pagado ? '✓ pagado' : '(pendiente)'}` : '—') : ''}
      ${fila('Parcela de origen', `${esc(l.nombre)} (${esc(l.codigo)})`)}
      ${fila('Productor', `${esc(l.productor.iniciales)}${l.productor.comunidad ? ' · ' + esc(l.productor.comunidad) : ''}`)}
      ${fila('Superficie', l.hectareas != null ? num(l.hectareas, 2) + ' ha' : '—')}
      ${fila('Coordenadas', l.coordenadas ? `${l.coordenadas.lat}, ${l.coordenadas.lng} <span class="text-xs text-gray-400">(±100 m)</span>` : 'no registradas')}
      ${fila('No deforestación', l.sin_deforestacion.declarada ? `Declarada el ${esc((l.sin_deforestacion.fecha || '').slice(0, 10))}` : 'sin declaración')}
    </div>
    ${l.sin_deforestacion.declarada ? `<p class="text-xs text-gray-400 mt-3">${esc(l.sin_deforestacion.nota)}</p>` : ''}
    ${d.cosechas && d.cosechas.length ? `<div class="mt-4 text-sm"><div class="font-medium mb-1">Cosechas recientes</div>${d.cosechas.map((c) => `<div class="text-gray-600">${esc(c.fecha)} · ${num(c.kilos)} kg</div>`).join('')}</div>` : ''}
  </div>`;
  if (window.QRCode) new QRCode($('#qr'), { text: location.href, width: 96, height: 96, colorDark: '#065f46' });
}

window.addEventListener('resize', () => { if (window.innerWidth >= 1024) $('#nav').classList.remove('hidden'); });
render();
</script>
</body>
</html>
