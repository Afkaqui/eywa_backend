<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f9fafb; }

    .rt thead { display: none; }

    .rt-wrap { border: 0 !important; padding: 0 !important; background: transparent !important; }
  }
  /* Identidad v2: movimiento (mismo sistema que la landing de EYWA) */
  @keyframes ey-blur-in { from { opacity: 0; filter: blur(10px); transform: translateY(10px); } to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes ey-fade-up { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: none; } }
  @keyframes ey-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes ey-float { 0%, 100% { transform: translateY(0) rotate(4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  @keyframes ey-zoom-out { from { transform: scale(1.12); } to { transform: scale(1); } }
  .ey-blur-in { display: inline-block; animation: ey-blur-in .9s cubic-bezier(.2,.7,.2,1) both; }
  .ey-float { animation: ey-float 6s ease-in-out infinite; }
  .ey-hero-zoom { animation: ey-zoom-out 2.4s cubic-bezier(.2,.7,.2,1) both; }
  .ey-lift { transition: transform .35s ease, box-shadow .35s ease; }
  .ey-lift:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(17,24,39,.10); }
  .ey-pill { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: 999px; padding: .9rem 1.6rem; font-weight: 700; transition: transform .2s ease; }
  .ey-pill:hover { transform: translateY(-2px); }
  @supports (animation-timeline: view()) {
    .ey-reveal { animation: ey-fade-up linear both; animation-timeline: view(); animation-range: entry 0% entry 70%; }
    .ey-reveal-blur { animation: ey-blur-in linear both; animation-timeline: view(); animation-range: entry 0% entry 60%; }

  /* Movimiento reducido: fundido suave en vez de nada (sin desplazamientos ni zoom) */
  @keyframes ey-fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .ey-blur-in { animation: ey-fade .6s ease both; }
    .ey-float, .ey-hero-zoom { animation: none !important; }
    .ey-lift:hover, .ey-pill:hover { transform: none; }
    @supports (animation-timeline: view()) {
      .ey-reveal, .ey-reveal-blur, .ey-reveal-pop { animation: ey-fade linear both; animation-timeline: view(); animation-range: entry 0% entry 50%; }
    }
  }
  /* Componentes animados (mismos que la landing de EYWA, en verde Agro) */
  @property --fx-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes fx-spin { to { --fx-angle: 360deg; } }
  @keyframes fx-shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes fx-ping { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); } 100% { box-shadow: 0 0 0 16px rgba(34,197,94,0); } }
  .fx-badge { background: linear-gradient(rgba(5,46,22,.55), rgba(5,46,22,.55)) padding-box, conic-gradient(from var(--fx-angle), #86efac, #22c55e, #fde68a, #22c55e, #86efac) border-box; border: 1.5px solid transparent; animation: fx-spin 5s linear infinite; }
  .fx-shine { background: linear-gradient(110deg, #bbf7d0 40%, #ffffff 50%, #bbf7d0 60%) 0 0 / 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fx-shine 3.2s linear infinite; }
  .fx-tl { position: relative; }
  .fx-tl-line { position: absolute; top: 0; bottom: 0; left: 23px; width: 3px; background: #e5e7eb; border-radius: 3px; }
  @media (min-width: 768px) { .fx-tl-line { left: 50%; transform: translateX(-50%); } }
  .fx-tl-line > i { display: block; width: 100%; height: calc(var(--p, 0) * 100%); background: linear-gradient(#86efac, #166534); border-radius: 3px; transition: height .15s linear; }
  .fx-tl-item { opacity: .3; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); transform: translateX(28px); }
  @media (min-width: 768px) { .fx-tl-item.izq { transform: translateX(-36px); } .fx-tl-item.der { transform: translateX(36px); } }
  .fx-tl-item.is-in { opacity: 1; transform: none; }
  .fx-tl-num { transition: background-color .4s, color .4s, border-color .4s; }
  .fx-tl-item.is-in .fx-tl-num { background: #22c55e; border-color: #22c55e; color: #fff; animation: fx-ping 1s ease-out 1; }
  .fx-tl-item.is-in .fx-tl-card { border-color: #bbf7d0; box-shadow: 0 14px 34px rgba(22,101,52,.10); }
  @keyframes fx-orbit { to { transform: rotate(360deg); } }
  @keyframes fx-twinkle { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .35; transform: scale(.6); } }
  @keyframes fx-orbits-in { from { opacity: 0; transform: scale(.7) rotate(-40deg); } to { opacity: 1; transform: none; } }
  .fx-orbits { animation: fx-orbits-in 1.6s cubic-bezier(.2,.7,.2,1) both; }
  .fx-orbit { animation: fx-orbit 80s linear infinite; }
  .fx-dot { animation: fx-twinkle 4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .fx-orbit { animation-duration: 240s !important; } .fx-dot { animation: none; }
    .fx-badge { animation-duration: 12s; } .fx-shine { animation: none; color: #bbf7d0; background: none; }
    .fx-tl-item, .fx-tl-item.izq, .fx-tl-item.der { transform: none; }
  }
  dialog::backdrop { background: rgba(17,24,39,.45); }
  dialog { border: 0; border-radius: 1rem; padding: 0; width: min(92vw, 440px); }

<script>
// ══ EYWA Agro — trazabilidad por organización ═══════════════════════════════════
// Misma cuenta y API que EYWA. Todo dato pertenece a una ORGANIZACIÓN (cooperativa,
// asociación, agroindustria); la activa viaja en la cabecera X-Agro-Org.
// Roles: admin (todo, incl. ventas/pagos y equipo) · tecnico (registra) · lector.
// Los textos del servidor se insertan siempre escapados.
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 0) => (n == null ? '—' : Number(n).toLocaleString('es-PE', { maximumFractionDigits: d }));
const hoy = () => new Date().toISOString().slice(0, 10);
const EYWA = 'https://eywa.encsust4in4ble.earth';
// La sesión se comparte entre pestañas (localStorage). Antes era por pestaña
// (sessionStorage) y había que volver a entrar en cada pestaña nueva.
const leer = (k) => { try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } };
const guardar = (k, v) => { try { sessionStorage.removeItem(k); v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
// Entrada única: EYWA emite un código de un solo uso y vuelve aquí (/sso#c=…).
const ENTRAR_CON_EYWA = EYWA + '/ir-a-agro';
// Si se cierra sesión en otra pestaña, esta también sale.
window.addEventListener('storage', (e) => { if (e.key === 'agro_token' && !e.newValue && token) { token = null; org = null; orgs = []; render(); } });
let token = leer('agro_token');
let orgs = [];          // organizaciones del usuario
let org = null;         // activa
const puede = { escribir: () => org && org.rol !== 'lector', admin: () => org && org.rol === 'admin' };

// ── Sin internet ─────────────────────────────────────────────────────────────
// Lo que se registra en el campo sin señal (productores, parcelas, cosechas,
// entregas) se guarda en el teléfono y se envía solo al volver la conexión.
// Las pantallas de consulta usan la última copia que guardó el service worker.
const ENCOLABLES = [/^\/agro\/productores$/, /^\/agro\/lotes$/, /^\/agro\/lotes\/[^/]+\/cosechas$/, /^\/agro\/entregas$/];
const ETIQUETA = { productores: 'Productor', lotes: 'Parcela', cosechas: 'Cosecha', entregas: 'Entrega' };
const pendientes = () => { try { return JSON.parse(localStorage.getItem('agro_pendientes') || '[]'); } catch { return []; } };
const guardarPendientes = (l) => { try { localStorage.setItem('agro_pendientes', JSON.stringify(l)); } catch {} pintarRed(); };
let enviando = false;

function pintarRed() {
  const el = $('#red'); if (!el) return;
  const n = token ? pendientes().length : 0;
  const errores = pendientes().filter((x) => x.error).length;
  if (navigator.onLine && !n) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="${navigator.onLine ? 'bg-amber-50 text-amber-900' : 'bg-gray-900 text-white'} text-sm">
    <div class="max-w-6xl mx-auto px-4 py-2 flex flex-wrap items-center gap-x-3 gap-y-1">
      <span class="font-semibold">${navigator.onLine ? 'Con conexión' : '● Sin conexión'}</span>
      <span class="opacity-80">${navigator.onLine ? '' : 'Puedes seguir registrando: se guarda en este teléfono.'}</span>
      ${n ? `<span class="ml-auto">${n} registro${n === 1 ? '' : 's'} por enviar${errores ? ` · ${errores} con error` : ''}</span>
        <a data-ir href="/pendientes" class="underline font-semibold">Ver</a>
        ${navigator.onLine ? '<button id="enviarYa" class="underline font-semibold">Enviar ahora</button>' : ''}` : ''}
    </div></div>`;
  const b = $('#enviarYa'); if (b) b.onclick = () => sincronizar(true);
}

async function sincronizar(manual = false) {
  if (enviando || !token || !navigator.onLine) return;
  const lista = pendientes(); if (!lista.length) return;
  enviando = true;
  let ok = 0;
  try {
    for (const it of lista) {
      if (it.error && !manual) continue; // los que fallaron esperan a que la persona los revise
      try {
        const r = await fetch('/api' + it.ruta, {
          method: it.method,
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, 'X-Agro-Org': it.org },
          body: it.body ? JSON.stringify(it.body) : undefined,
        });
        if (r.status === 401) { salir(); return; }
        const d = await r.json().catch(() => ({}));
        if (r.ok) { guardarPendientes(pendientes().filter((x) => x.id !== it.id)); ok++; }
        else guardarPendientes(pendientes().map((x) => x.id === it.id ? { ...x, error: d.error || ('Error ' + r.status) } : x));
      } catch { break; } // se cortó la señal otra vez: se reintenta luego
    }
  } finally { enviando = false; pintarRed(); }
  if (ok) { flash(`Se enviaron ${ok} registro${ok === 1 ? '' : 's'} guardados sin conexión.`); if (location.pathname !== '/pendientes') render(); }
}
function flash(t) {
  const d = document.createElement('div');
  d.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-green-800 text-white text-sm px-4 py-2.5 rounded-full shadow-lg';
  d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}
window.addEventListener('online', () => { pintarRed(); sincronizar(); });
window.addEventListener('offline', pintarRed);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

async function api(ruta, opt = {}) {
  const metodo = opt.method || 'GET';
  const encolar = () => {
    const tipo = ruta.split('/').filter(Boolean).pop();
    const it = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ruta, method: metodo, body: opt.body ?? null,
      org: org?.id, orgNombre: org?.nombre, tipo: ETIQUETA[tipo] || 'Registro', at: new Date().toISOString() };
    guardarPendientes([...pendientes(), it]);
    return { encolado: true };
  };
  const puedeEncolar = metodo === 'POST' && org && ENCOLABLES.some((re) => re.test(ruta));
  if (puedeEncolar && !navigator.onLine) return encolar();
  let r;
  try {
    r = await fetch('/api' + ruta, {
      method: metodo,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(org ? { 'X-Agro-Org': org.id } : {}) },
      body: opt.body ? JSON.stringify(opt.body) : undefined,
    });
  } catch (e) {
    if (puedeEncolar) return encolar(); // la señal se cayó justo al enviar
    throw new Error(navigator.onLine ? 'No se pudo conectar con el servidor' : 'Sin conexión: esta acción necesita internet');
  }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { salir(); throw new Error('Tu sesión expiró'); }
  if (!r.ok && !opt.aceptar?.includes(r.status)) throw new Error(d.error || ('Error ' + r.status));
  return opt.conEstado ? { status: r.status, d } : d;
}
function salir(preguntar = false) {
  const n = pendientes().length;
  if (preguntar && n && !confirm(`Tienes ${n} registro${n === 1 ? '' : 's'} guardado${n === 1 ? '' : 's'} sin conexión que aún no se enviaron. Si sales, se perderán. ¿Salir igual?`)) return;
  token = null; org = null; orgs = []; guardar('agro_token', null); guardar('agro_org', null);
  if (preguntar) guardarPendientes([]);
  navigator.serviceWorker?.controller?.postMessage('limpiar'); // borra la copia de datos de este teléfono
  ir('/');
}
function ir(ruta) { history.pushState({}, '', ruta); window.scrollTo(0, 0); render(); }
window.ir = ir;
window.addEventListener('popstate', render);
document.addEventListener('click', (e) => { const a = e.target.closest('a[data-ir]'); if (a) { e.preventDefault(); cerrarMenu(); ir(a.getAttribute('href')); } });

// ── Cabecera: organización activa + menú (hamburguesa en móvil) ──
function cerrarMenu() { const n = $('#nav'); if (window.innerWidth < 1024) n.classList.add('hidden'); $('#hamb').setAttribute('aria-expanded', 'false'); }
$('#hamb').onclick = () => { const n = $('#nav'); n.classList.toggle('hidden'); n.classList.add('flex'); $('#hamb').setAttribute('aria-expanded', String(!n.classList.contains('hidden'))); };
function cabecera() {
  const items = token && org ? [['/', 'Panel'], ['/productores', 'Productores'], ['/lotes', 'Parcelas'], ['/acopio', 'Acopio'],
    ...(puede.escribir() ? [['/importar', 'Importar Excel']] : []), ['/equipo', 'Equipo'], ['/fondos', 'Fondos'], ['/actores', 'Actores'], ['/glosario', 'Glosario']] : [];
  $('#nav').innerHTML = items.map(([h, t]) => `<a data-ir href="${h}" class="px-3 py-2 rounded-full whitespace-nowrap ${location.pathname === h ? 'bg-gray-900 text-white' : 'hover:bg-gray-100'}">${t}</a>`).join('')
    + (token ? '<button id="salir" class="px-3 py-2 text-gray-500 hover:text-gray-800 text-left">Salir</button>' : '');
  const s = $('#salir'); if (s) s.onclick = () => salir(true);
  $('#hamb').style.display = token ? '' : 'none';
  $('#orgsel').innerHTML = token && orgs.length ? `
    <select id="org" class="inp !py-1.5 !text-sm max-w-[13rem] sm:max-w-xs truncate" aria-label="Organización activa">
      ${orgs.map((o) => `<option value="${o.id}" ${org && o.id === org.id ? 'selected' : ''}>${esc(o.nombre)} · ${esc(etiquetaRol(o.rol))}</option>`).join('')}
      <option value="__nueva">+ Nueva organización</option>
    </select>` : '';
  const sel = $('#org');
  if (sel) sel.onchange = () => {
    if (sel.value === '__nueva') return ir('/organizaciones');
    org = orgs.find((o) => o.id === sel.value); guardar('agro_org', org.id); render();
  };
}
const etiquetaRol = (r) => ({ admin: 'administrador', tecnico: 'técnico de campo', lector: 'lector' }[r] || r);

function aviso(msg, tipo = 'error') {
  return `<div class="mb-4 text-sm rounded-lg p-3 ${tipo === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'}">${esc(msg)}</div>`;
}
function datosForm(f) {
  const o = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.value === '') o[el.name] = null;
    else o[el.name] = el.dataset.num !== undefined ? Number(el.value) : el.value;
  }
  return o;
}

// Órbitas de puntos que giran en sentidos opuestos (hero "vivo"), en verdes y ámbar.
function orbitas(size, rings) {
  const col = ['#86efac', '#22c55e', '#bbf7d0', '#fbbf24', '#4ade80', '#dcfce7', '#16a34a'];
  let h = `<div aria-hidden="true" class="fx-orbits pointer-events-none absolute" style="width:${size}px;height:${size}px">`;
  for (let k = 0; k < rings; k++) {
    const r = size / 2 - k * (size / (rings * 2.6)), n = Math.round((2 * Math.PI * r) / 26);
    h += `<div class="fx-orbit absolute left-1/2 top-1/2" style="width:${r * 2}px;height:${r * 2}px;margin:-${r}px 0 0 -${r}px;animation-duration:${70 + k * 25}s;animation-direction:${k % 2 ? 'reverse' : 'normal'}">`;
    for (let i = 0; i < n; i++) {
      const t = (i / n) * 2 * Math.PI, s = 4 + ((i * 7 + k * 3) % 4);
      h += `<span class="fx-dot absolute rounded-full" style="width:${s}px;height:${s}px;left:${(r + r * Math.cos(t) - s / 2).toFixed(1)}px;top:${(r + r * Math.sin(t) - s / 2).toFixed(1)}px;background:${col[(i * 3 + k) % col.length]};animation-delay:${((i * 37 + k * 11) % 40) / 10}s"></span>`;
    }
    h += '</div>';
  }
  return h + '</div>';
}

// Pasos que se encienden con el scroll y cifras que cuentan (sin dependencias).
function animarLanding(app) {
  const tl = $('#pasosTl', app), cifras = [...app.querySelectorAll('[data-count]')];
  const reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  cifras.forEach((el) => {
    const fin = +el.dataset.count; if (reducir) return;
    el.textContent = '0';
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return; obs.disconnect();
      const t0 = performance.now();
      const paso = (t) => { const k = Math.min(1, (t - t0) / 1400); el.textContent = Math.round(fin * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(paso); };
      requestAnimationFrame(paso);
    }, { threshold: 0.4 });
    obs.observe(el);
  });
  if (!tl) return;
  let raf = 0;
  const medir = () => {
    raf = 0;
    if (!tl.isConnected) { removeEventListener('scroll', alScroll); return; }
    const r = tl.getBoundingClientRect(), vh = innerHeight;
    tl.style.setProperty('--p', Math.min(1, Math.max(0, (vh * 0.7 - r.top) / r.height)));
    tl.querySelectorAll('.fx-tl-item').forEach((li) => li.classList.toggle('is-in', li.getBoundingClientRect().top < vh * 0.78));
  };
  const alScroll = () => { if (!raf) raf = requestAnimationFrame(medir); };
  addEventListener('scroll', alScroll, { passive: true });
  medir();
}

    <input class="inp" name="kilos" data-num type="number" step="0.1" min="0" placeholder="Kilos" required>

  <div class="card rt-wrap">${tabla(['Saco', 'Parcela', 'Entrega', 'Venta', 'Al productor', ''], es.map((e) => [
    `<a class="text-emerald-700 underline whitespace-nowrap" href="/p/${esc(e.codigo)}" target="_blank">${esc(e.codigo)}</a>`,
    `${esc(e.lote)}<div class="text-xs text-gray-400">${esc(e.productor)}</div>`,

    e.fecha_venta ? `${esc(e.fecha_venta)}<div class="text-xs text-gray-400">USD ${num(e.precio_referencia, 2)}/t · ${num(e.porcentaje_pactado, 1)} %</div>` : '<span class="text-xs text-gray-400">sin vender</span>',

    !puede.admin() ? '' : (!e.fecha_venta ? `<button class="btn2" data-venta="${e.id}" data-pct="${e.porcentaje_pactado ?? ''}">Registrar venta</button>` : '')
      + (e.monto_productor != null && !e.pagado_at ? `<button class="btn2" data-pago="${e.id}">Marcar pagado</button>` : ''),
  ]), 'Aún no hay entregas.')}</div>`;

    e.preventDefault();

// ── Importar Excel ──
// Columnas de la plantilla. Se aceptan sinónimos y mayúsculas/tildes indistintas.
const COLUMNAS = ['productor', 'dni', 'comunidad', 'telefono', 'lote', 'cultivo', 'variedad', 'hectareas',
  'departamento', 'provincia', 'distrito', 'latitud', 'longitud', 'sin_deforestacion'];
const SINONIMOS = { nombre: 'productor', nombre_productor: 'productor', productor_nombre: 'productor', parcela: 'lote', nombre_lote: 'lote',
  nombre_parcela: 'lote', ha: 'hectareas', area: 'hectareas', lat: 'latitud', lon: 'longitud', lng: 'longitud', long: 'longitud',
  celular: 'telefono', no_deforestacion: 'sin_deforestacion', declara_no_deforestacion: 'sin_deforestacion', deforestacion: 'sin_deforestacion' };
const normCol = (k) => { const c = String(k).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); return SINONIMOS[c] || c; };

function descargarPlantilla() {
  const ejemplo = { productor: 'María Quispe Huamán', dni: '40123456', comunidad: 'Kepashiato', telefono: '987654321', lote: 'Parcela El Mirador',
    cultivo: org.cadena || 'cacao', variedad: 'Chuncho', hectareas: 1.5, departamento: 'Cusco', provincia: 'La Convención', distrito: 'Megantoni',
    latitud: -12.6134, longitud: -72.9421, sin_deforestacion: 'sí' };
  const ws = XLSX.utils.json_to_sheet([ejemplo], { header: COLUMNAS });
  ws['!cols'] = COLUMNAS.map(() => ({ wch: 16 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'productores_parcelas');
  XLSX.writeFile(wb, 'plantilla_eywa_agro.xlsx');
}

function importar(app) {
  app.innerHTML = `
  <h1 class="text-2xl font-semibold tracking-tight mb-1">Importar productores y parcelas</h1>
  <p class="text-sm text-gray-500 mb-5">Una fila por parcela. Si un productor tiene varias parcelas, repite su nombre y DNI. Se valida todo antes de guardar: si hay errores, no se guarda nada y verás qué corregir.</p>
  <div class="grid lg:grid-cols-3 gap-4">
    <div class="card space-y-3 h-fit">
      <div class="font-medium">1 · Plantilla</div>
      <p class="text-sm text-gray-600">Columnas: ${COLUMNAS.map((c) => `<code class="text-xs bg-gray-100 rounded px-1">${c}</code>`).join(' ')}</p>
      <p class="text-xs text-gray-500">Obligatorias: productor y lote. El DNI evita duplicados. "sin_deforestacion": sí / no.</p>
      <button id="plantilla" class="btn2">Descargar plantilla (.xlsx)</button>
      <div class="font-medium pt-2">2 · Tu archivo</div>
      <input id="arch" type="file" accept=".xlsx,.xls,.csv" class="block w-full text-sm file:mr-3 file:btn2 file:border file:border-gray-200 file:rounded-lg file:bg-white file:px-3 file:py-2">
    </div>
    <div class="card lg:col-span-2" id="res"><p class="text-sm text-gray-500">Elige un archivo para revisarlo.</p></div>
  </div>`;
  $('#plantilla').onclick = () => (window.XLSX ? descargarPlantilla() : alert('Cargando… intenta de nuevo en unos segundos'));
  let filas = [];
  $('#arch').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (!window.XLSX) return alert('Cargando el lector de Excel… intenta de nuevo');
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const crudas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
      filas = crudas.map((r) => Object.fromEntries(Object.entries(r).map(([k, v]) => [normCol(k), v])))
        .filter((r) => Object.values(r).some((v) => String(v).trim() !== ''));
      const desconocidas = [...new Set(crudas.flatMap((r) => Object.keys(r)).map(normCol))].filter((c) => !COLUMNAS.includes(c) && !c.startsWith('empty'));
      await validar(true, desconocidas);
    } catch (err) { $('#res').innerHTML = aviso('No se pudo leer el archivo: ' + err.message); }
  };
  async function validar(simular, desconocidas = []) {
    $('#res').innerHTML = '<p class="text-sm text-gray-400">Revisando…</p>';
    const { status, d } = await api('/agro/importar', { method: 'POST', body: { filas, simular }, aceptar: [422], conEstado: true });
    const r = d.resumen || {};
    const cifras = `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
      ${[['Filas', r.filas], ['Productores nuevos', r.productores_nuevos], ['Ya existentes', r.productores_existentes], ['Parcelas nuevas', r.lotes_nuevos]]
        .map(([t, v]) => `<div class="bg-gray-50 rounded-lg p-3"><div class="text-xl font-light">${num(v)}</div><div class="text-[11px] uppercase text-gray-500">${t}</div></div>`).join('')}</div>`;
    const ignoradas = desconocidas.length ? `<p class="text-xs text-amber-700 mb-3">Columnas que no se usan: ${desconocidas.map(esc).join(', ')}</p>` : '';
    if (status === 422) {
      $('#res').innerHTML = aviso(`Hay ${d.errores.length} fila(s) con errores. No se guardó nada.`) + cifras + ignoradas
        + `<div class="rt-wrap">${tabla(['Fila', 'Error'], d.errores.slice(0, 200).map((x) => [x.fila, esc(x.mensaje)]), '')}</div>`;
      return;
    }
    if (d.guardado) { orgs = []; $('#res').innerHTML = aviso(`Listo: se guardaron ${r.lotes_nuevos} parcelas y ${r.productores_nuevos} productores nuevos.`, 'ok') + cifras + '<a data-ir href="/lotes" class="btn inline-block">Ver parcelas</a>'; return; }
    $('#res').innerHTML = aviso('El archivo está correcto. Revisa las cifras y confirma.', 'ok') + cifras + ignoradas + '<button id="conf" class="btn">Importar ahora</button>';
    $('#conf').onclick = () => validar(false, desconocidas).catch((err) => { $('#res').innerHTML = aviso(err.message); });
  }
}

async function fondos(app) {

  const agro = todos.filter((f) => (f.sector_tags || []).some((t) => ['agro', 'ambiente', 'clima', 'circular'].includes(t)));

  <p class="text-sm text-gray-500 mb-5">${agro.length} de ${todos.length} fondos del catálogo de EYWA (agro, ambiente, clima y economía circular). Se verifican automáticamente cada noche.</p>

  <div class="max-w-2xl mx-auto card">
    <div class="flex flex-col-reverse sm:flex-row items-start justify-between gap-4">
      <div class="min-w-0"><div class="text-xs uppercase tracking-widest text-emerald-700 font-semibold">Pasaporte digital · ${s ? 'saco' : 'parcela'}</div>
        <h1 class="text-2xl font-semibold tracking-tight mt-1 break-words">${esc(s ? s.codigo : l.nombre)}</h1>
        <div class="text-sm text-gray-500">${esc(l.cultivo)} ${esc(l.variedad || '')} · ${esc(l.ubicacion || 'ubicación no registrada')}</div></div>
      <div id="qr" class="shrink-0 self-center sm:self-start"></div>
    </div>
    <div class="mt-5">
      ${s ? fila('Entregado en acopio', `${esc(s.fecha_entrega)} · ${num(s.kilos, 1)} kg${s.calidad ? ' · ' + esc(s.calidad) : ''}`)
         + fila('Vendido', s.fecha_venta ? `${esc(s.fecha_venta)} · USD ${num(s.precio_referencia, 2)}/t` : 'aún no')
         + fila('Pactado con el productor', s.porcentaje_pactado != null ? num(s.porcentaje_pactado, 1) + ' % del precio' : '—')
         + fila('Recibió el productor', s.monto_productor != null ? `USD ${num(s.monto_productor, 2)} ${s.pagado ? '✓ pagado' : '(pendiente)'}` : '—') : ''}
      ${fila('Parcela de origen', `${esc(l.nombre)} (${esc(l.codigo)})`)}
      ${fila('Productor', `${esc(l.productor.nombre || l.productor.iniciales)}${l.productor.comunidad ? ' · ' + esc(l.productor.comunidad) : ''}`)}
      ${fila('Superficie', l.hectareas != null ? num(l.hectareas, 2) + ' ha' : '—')}
      ${fila('Coordenadas', l.coordenadas ? `${l.coordenadas.lat}, ${l.coordenadas.lng} <span class="text-xs text-gray-400">(±100 m)</span>` : 'no registradas')}
      ${fila('No deforestación', l.sin_deforestacion.declarada ? `Declarada el ${esc((l.sin_deforestacion.fecha || '').slice(0, 10))}` : 'sin declaración')}
    </div>
    ${l.sin_deforestacion.declarada ? `<p class="text-xs text-gray-400 mt-3">${esc(l.sin_deforestacion.nota)}</p>` : ''}
    ${d.cosechas && d.cosechas.length ? `<div class="mt-4 text-sm"><div class="font-medium mb-1">Cosechas recientes</div>${d.cosechas.map((c) => `<div class="text-gray-600">${esc(c.fecha)} · ${num(c.kilos)} kg</div>`).join('')}</div>` : ''}
  </div>`;
  if (window.QRCode) new QRCode($('#qr'), { text: location.href, width: 96, height: 96, colorDark: '#065f46' });
}

window.addEventListener('resize', () => { if (window.innerWidth >= 1024) $('#nav').classList.remove('hidden'); });
render();
</script>
</body>
</html>
